<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STYLE COMPASS ― パーソナル診断</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#FFFFFF;
  --tarmac:#F6F1EA;
  --asphalt:#EDE5D8;
  --line:#D9CEBD;
  --chalk:#2B2622;
  --dim:#7A6F63;
  --tape:#2F6B57;
  --accent-text:#2F6B57;
  --press:#21503F;
  --alert:#C0462B;
  --sand:#F6F1EA;
  --clay:#C8744F;

  --display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;

  --tape-stripe:var(--tape);
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--black);
  color:var(--chalk);
  font-family:var(--body);
  font-weight:500;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:48px 18px 90px;
  line-height:1.7;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

:focus-visible{
  outline:3px solid var(--tape);
  outline-offset:2px;
}

.stage{
  width:100%;
  max-width:720px;
}

/* ---------------- MASTHEAD ---------------- */

.masthead{
  text-align:left;
  margin-bottom:30px;
}

.masthead h1{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(3rem,13vw,5.8rem);
  line-height:.92;
  letter-spacing:-.03em;
  margin:0 0 16px;
  animation:wordmark .7s cubic-bezier(.2,.8,.2,1) both;
}

.masthead p{
  margin:0;
  font-size:.92rem;
  color:var(--dim);
}

@keyframes wordmark{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@media (prefers-reduced-motion:reduce){
  .masthead h1{animation:none;}
  *{transition:none !important;}
}

/* ---------------- CARD ---------------- */

.card{
  background:var(--tarmac);
  color:var(--chalk);
  border:1px solid var(--line);
  border-radius:0;
  padding:48px 36px 40px;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:12px;
  background:var(--tape-stripe);
}

/* ---------------- HOME ---------------- */

.home{
  text-align:left;
}

.home h2{
  font-family:var(--display);
  font-weight:400;
  font-size:1.9rem;
  line-height:1.3;
  margin:0 0 12px;
}

.home-lead{
  color:var(--dim);
  margin:0 0 30px;
  max-width:520px;
  font-size:.95rem;
}

.home-options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.home-option{
  display:grid;
  grid-template-columns:60px 1fr 30px;
  align-items:center;
  gap:16px;
  width:100%;
  text-align:left;
  padding:20px;
  border:1px solid var(--line);
  background:var(--black);
  color:var(--chalk);
  cursor:pointer;
  border-radius:0;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}

.home-option:hover{
  background:var(--tape);
  border-color:var(--tape);
  color:#fff;
}

.home-icon{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  background:var(--tape);
  color:#fff;
  border-radius:0;
  font-size:1.35rem;
}

.home-option:hover .home-icon{
  background:#000;
}

.home-option h3{
  font-family:var(--display);
  font-weight:400;
  font-size:1.1rem;
  margin:0 0 4px;
}

.home-option p{
  margin:0;
  font-size:.82rem;
  color:var(--dim);
}

.home-option:hover p{
  color:#fff;
}

.home-arrow{
  font-size:1.5rem;
  color:var(--accent-text);
}

.home-option:hover .home-arrow{
  color:#fff;
}

.home-note{
  margin:24px 0 0;
  font-size:.78rem;
  color:var(--dim);
}

/* ---------------- COMMON ---------------- */

.quiz-nav{
  display:flex;
  justify-content:flex-start;
  margin-bottom:18px;
}

.back-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-size:.85rem;
  font-weight:700;
  color:var(--dim);
  padding:5px 0;
}

.back-btn:hover{
  color:var(--accent-text);
}

.part-label{
  font-size:.85rem;
  color:var(--accent-text);
  font-weight:700;
  margin-bottom:10px;
}

.stitch-track{
  display:flex;
  gap:3px;
  margin-bottom:8px;
}

.stitch{
  flex:1;
  height:8px;
  background:var(--line);
}

.stitch.done{
  background:var(--tape-stripe);
}

.progress-label{
  font-size:.78rem;
  color:var(--dim);
  margin:0 0 28px;
  text-align:right;
}

.question h2{
  font-family:var(--display);
  font-weight:400;
  font-size:1.35rem;
  margin:0 0 26px;
  line-height:1.55;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:16px 18px;
  background:var(--black);
  border:1px solid var(--line);
  border-radius:0;
  cursor:pointer;
  font-size:.96rem;
  text-align:left;
  color:var(--chalk);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}

.option:hover{
  background:var(--tape);
  border-color:var(--tape);
  color:#fff;
}

.option:active{
  transform:scale(.99);
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--line);
  flex:0 0 auto;
  margin-top:8px;
}

.option:hover .dot{
  background:#000;
}

/* ---------------- GENDER ---------------- */

.gender-options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.gender-option{
  padding:20px;
  background:var(--black);
  border:1px solid var(--line);
  border-radius:0;
  cursor:pointer;
  font-size:1rem;
  text-align:left;
  color:var(--chalk);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}

.gender-option:hover{
  background:var(--tape);
  border-color:var(--tape);
  color:#fff;
}

/* ---------------- INPUT ---------------- */

.input-box{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.input-box label{
  font-size:.85rem;
  font-weight:700;
  color:var(--dim);
}

.input-box input{
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  background:var(--black);
  color:var(--chalk);
  border-radius:0;
  outline:none;
}

.input-box input:focus{
  border-color:var(--tape);
}

.primary-btn{
  margin-top:18px;
  width:100%;
  padding:16px 20px;
  border:none;
  background:var(--tape);
  color:#fff;
  cursor:pointer;
  font-family:var(--display);
  font-weight:400;
  font-size:1rem;
  border-radius:0;
  transition:background .15s ease;
}

.primary-btn:hover{
  background:var(--press);
}

/* ---------------- SWATCH ---------------- */

.swatch-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.swatch-option{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  background:var(--black);
  border:1px solid var(--line);
  padding:14px 6px 10px;
  color:var(--chalk);
  transition:border-color .15s ease;
}

.swatch-option:hover{
  border-color:var(--tape);
}

.swatch-circle{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid var(--line);
  transition:transform .15s ease,border-color .15s ease;
}

.swatch-option:hover .swatch-circle{
  transform:scale(1.1);
  border-color:var(--tape);
}

.swatch-option span.label{
  font-size:.76rem;
  color:var(--dim);
  text-align:center;
}

.swatch-option:hover span.label{
  color:var(--chalk);
}

/* ---------------- PHOTO ---------------- */

.photo-intro{
  margin:-6px 0 24px;
  color:var(--dim);
  font-size:.92rem;
}

.photo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.photo-box{
  background:var(--black);
  border:1px solid var(--line);
  padding:16px;
}

.photo-box h3{
  font-family:var(--display);
  font-weight:400;
  margin:0 0 5px;
  font-size:1rem;
  line-height:1.4;
}

.photo-box p{
  margin:0 0 14px;
  color:var(--dim);
  font-size:.78rem;
}

.photo-preview{
  width:100%;
  aspect-ratio:3/4;
  background:var(--asphalt);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:12px;
  color:var(--dim);
  font-size:.78rem;
  text-align:center;
}

.photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-actions{
  display:flex;
  gap:7px;
  flex-direction:column;
}

.photo-btn{
  display:block;
  width:100%;
  padding:11px;
  background:var(--chalk);
  color:#000;
  border:1px solid var(--chalk);
  cursor:pointer;
  font-size:.8rem;
  font-weight:700;
  text-align:center;
}

.photo-btn:hover{
  background:var(--tape);
  border-color:var(--tape);
  color:#fff;
}

.photo-btn.secondary{
  background:transparent;
  color:var(--chalk);
  border-color:var(--line);
}

.photo-btn.secondary:hover{
  background:var(--tape);
  color:#fff;
  border-color:var(--tape);
}

.photo-file{
  display:none;
}

.photo-status{
  margin-top:7px;
  font-size:.74rem;
  color:var(--accent-text);
  min-height:18px;
}

.ai-note{
  margin-top:18px;
  padding:16px 18px;
  background:var(--asphalt);
  border:1px dashed var(--line);
  font-size:.8rem;
  color:var(--dim);
}

.ai-note strong{
  color:var(--chalk);
}

/* ---------------- RESULT ---------------- */

.result-name{
  font-family:var(--display);
  font-weight:400;
  font-size:2rem;
  line-height:1.3;
  margin:0 0 22px;
}

.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:28px;
}

.chip{
  padding:7px 12px;
  border:1px solid var(--chalk);
  font-size:.82rem;
  font-weight:700;
  background:transparent;
  color:var(--chalk);
}

.section-block{
  margin-bottom:34px;
  padding-bottom:30px;
  border-bottom:1px solid var(--line);
}

.section-block:last-of-type{
  border-bottom:none;
}

.section-block h3{
  font-family:var(--display);
  font-weight:400;
  font-size:1.2rem;
  line-height:1.4;
  margin:0 0 10px;
}

.section-block p.desc{
  margin:0 0 16px;
  font-size:.92rem;
  color:var(--dim);
}

.section-block h4{
  font-size:.85rem;
  color:var(--chalk);
  margin:0 0 8px;
  font-weight:700;
}

.section-block ul{
  margin:0 0 16px;
  padding-left:20px;
}

.section-block li{
  margin-bottom:5px;
}

.palette{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.palette span{
  width:38px;
  height:38px;
  border-radius:50%;
  display:inline-block;
  border:2px solid var(--line);
}

.bars{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.bar-row{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:.82rem;
}

.bar-label{
  width:78px;
  flex:0 0 auto;
  color:var(--chalk);
  font-weight:700;
}

.bar-track{
  flex:1;
  height:10px;
  background:var(--line);
  overflow:hidden;
}

.bar-fill{
  height:100%;
}

.bar-pct{
  width:36px;
  text-align:right;
  color:var(--dim);
}

/* 診断結果の見出しブロック：画面でいちばん大きな黄色 */

.combo-box{
  background:var(--tape);
  color:#fff;
  padding:28px 26px;
  margin-bottom:34px;
}

.combo-box h3{
  font-family:var(--display);
  font-weight:400;
  font-size:1.3rem;
  line-height:1.5;
  margin:0 0 10px;
}

.combo-box p{
  margin:0;
  font-size:.93rem;
  font-weight:700;
  color:#F2F6FF;
}

/* ---------------- RECOMMEND ---------------- */

.recommend-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.recommend-item{
  background:var(--black);
  border:1px solid var(--line);
  padding:15px;
}

.recommend-item small{
  display:block;
  color:var(--dim);
  font-size:.74rem;
  margin-bottom:3px;
}

.recommend-item strong{
  font-size:.92rem;
}

.photo-result{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.photo-result img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  background:var(--asphalt);
  border:1px solid var(--line);
}

/* ---------------- SHOP ---------------- */

.shop-block{
  margin-top:10px;
}

.shop-block h3{
  font-family:var(--display);
  font-weight:400;
  font-size:1.2rem;
  margin:0 0 6px;
}

.shop-block > p.desc{
  margin:0 0 18px;
  font-size:.92rem;
  color:var(--dim);
}

.shop-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.shop-item:last-child{
  border-bottom:none;
}

.shop-item-name{
  font-size:.92rem;
  font-weight:700;
}

.shop-links{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.shop-link{
  font-size:.78rem;
  font-weight:700;
  text-decoration:none;
  color:var(--chalk);
  background:transparent;
  border:1px solid var(--line);
  padding:8px 12px;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}

.shop-link:hover{
  background:var(--tape);
  border-color:var(--tape);
  color:#fff;
}

.shop-link.zozo{
  background:var(--tape);
  border-color:var(--tape);
  color:#fff;
}

.shop-link.zozo:hover{
  background:var(--press);
  border-color:var(--press);
}

.restart{
  display:inline-block;
  margin-top:22px;
  background:transparent;
  color:var(--chalk);
  border:1px solid var(--chalk);
  padding:14px 26px;
  font-size:.95rem;
  font-weight:700;
  border-radius:0;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}

.restart:hover{
  background:var(--tape);
  color:#fff;
}

/* ---------------- ZOZO CTA / PRODUCTS ---------------- */

.zozo-cta{
  display:block;
  margin:0 0 28px;
  padding:18px 22px;
  background:transparent;
  color:var(--chalk);
  text-decoration:none;
  border:2px solid var(--tape);
  transition:background .15s ease,color .15s ease;
}

.zozo-cta:hover{
  background:var(--tape);
  color:#fff;
}

.zozo-cta strong{
  display:block;
  font-family:var(--display);
  font-weight:400;
  font-size:1.05rem;
  line-height:1.5;
  margin-bottom:3px;
}

.zozo-cta span{
  font-size:.8rem;
  color:var(--dim);
}

.zozo-cta:hover span{
  color:#fff;
}

.product-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product-card{
  background:var(--black);
  border:1px solid var(--line);
  padding:16px;
  display:flex;
  flex-direction:column;
}

.product-card.pick{
  border-color:var(--tape);
}

.product-kind{
  font-size:.74rem;
  color:var(--dim);
  font-weight:700;
  margin-bottom:6px;
}

.product-card.pick .product-kind{
  color:var(--accent-text);
}

.product-brand{
  font-size:.76rem;
  color:var(--dim);
  font-weight:700;
}

.product-name{
  font-family:var(--display);
  font-weight:400;
  font-size:.98rem;
  line-height:1.5;
  margin:2px 0 8px;
}

.product-why{
  margin:0 0 14px;
  font-size:.82rem;
  color:var(--dim);
  flex:1;
}

.color-hint{
  margin:16px 0 0;
  padding:14px 16px;
  background:var(--asphalt);
  border:1px dashed var(--line);
  font-size:.82rem;
  color:var(--dim);
}

/* ---------------- PHOTO ANALYSIS ---------------- */

.api-box{
  margin-top:14px;
  font-size:.8rem;
  color:var(--dim);
}

.api-box summary{
  cursor:pointer;
  font-weight:700;
  color:var(--chalk);
}

.api-box input{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid var(--line);
  background:var(--black);
  color:var(--chalk);
  border-radius:0;
  outline:none;
}

.api-box input:focus{
  border-color:var(--tape);
}

.api-box p{
  margin:8px 0 0;
  color:var(--dim);
  font-size:.76rem;
}

.loading-box{
  padding:50px 0;
}

.spinner{
  width:42px;
  height:42px;
  margin:0 0 22px;
  border:5px solid var(--line);
  border-top-color:var(--tape);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.loading-box h2{
  font-family:var(--display);
  font-weight:400;
  font-size:1.25rem;
  margin:0 0 8px;
}

.loading-box p{
  margin:0;
  font-size:.88rem;
  color:var(--dim);
}

.error-box{
  background:var(--asphalt);
  border:1px solid var(--line);
  border-left:6px solid var(--alert);
  padding:16px 18px;
  font-size:.9rem;
  margin:0 0 18px;
}

.gender-toggle{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin:0 0 26px;
  font-size:.82rem;
  font-weight:700;
}

.toggle-btn{
  border:1px solid var(--line);
  background:transparent;
  color:var(--chalk);
  padding:8px 14px;
  font-size:.8rem;
  font-weight:700;
  cursor:pointer;
}

.toggle-btn:hover{
  border-color:var(--tape);
}

.toggle-btn.active{
  background:var(--tape);
  color:#fff;
  border-color:var(--tape);
}

/* ---------------- RESPONSIVE ---------------- */

@media(max-width:520px){

  body{
    padding:30px 12px 60px;
  }

  .card{
    padding:40px 20px 30px;
  }

  .photo-grid,
  .recommend-grid,
  .product-grid{
    grid-template-columns:1fr;
  }

  .swatch-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .home-option{
    grid-template-columns:48px 1fr 22px;
    padding:16px;
    gap:12px;
  }

  .home-icon{
    width:44px;
    height:44px;
  }

  .result-name{
    font-size:1.55rem;
  }

  .shop-item{
    align-items:flex-start;
  }

}


/* ================= THEME OVERRIDE: Print / Catalogue ================= */
body{background:var(--sand);color:var(--chalk);padding-top:56px;}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px;}

/* ヘッダー：左寄せ、細い罫線 */
.masthead{
  text-align:left;
  margin-bottom:0;
  padding-bottom:18px;
  border-bottom:1px solid var(--chalk);
}
.masthead h1{
  font-weight:800;
  font-size:clamp(2.2rem,9vw,3.4rem);
  line-height:1.05;
  letter-spacing:.04em;
  margin:0 0 10px;
}
.masthead p{font-size:.82rem;letter-spacing:.1em;color:var(--dim);}

/* カード枠をなくし、紙面に直接載せる */
.card{
  background:transparent;
  border:none;
  border-radius:0;
  box-shadow:none;
  padding:36px 0 0;
}
.card::before{display:none;}

.home h2,.question h2,.result-name,.section-block h3,.shop-block h3,

.options,.gender-options,.home-options{gap:0;border-top:1px solid var(--chalk);}
.options{counter-reset:opt;}
.gender-options{counter-reset:opt;}
.option,.gender-option,.home-option{
  background:transparent;
  border:none;
  border-bottom:1px solid var(--line);
  border-radius:0;
  box-shadow:none;
  padding:18px 6px;
  transition:background .15s ease,padding .15s ease,color .15s ease;
}
.option,.gender-option{counter-increment:opt;display:flex;gap:18px;align-items:baseline;}
.option::before,.gender-option::before{
  content:counter(opt,decimal-leading-zero);
  font-family:var(--display);
  font-size:.85rem;
  color:var(--clay);
  flex:0 0 auto;
}
.dot{display:none;}
.option:hover,.gender-option:hover,.home-option:hover{
  background:var(--tape);
  color:#fff;
  padding-left:16px;
  transform:none;
  box-shadow:none;
}
.option:hover::before,.gender-option:hover::before{color:#fff;}

/* ホーム：絵文字アイコンを章番号に */
.home-option{grid-template-columns:56px 1fr 24px;}
.home-icon{
  background:transparent;
  color:var(--clay);
  font-size:0;
  width:auto;height:auto;

}

const RAKUTEN_SEARCH="https://search.rakuten.co.jp/search/mall/";

/* ZOZOTOWNのWeb検索はキーワードをShift_JISで受け取るため、
   ブラウザのTextDecoderから逆引き表を作ってエンコードする */

let SJIS_MAP=null;

function buildSjisMap(){

  const map=new Map();
  const dec=new TextDecoder("shift_jis");

  /* 半角カナ */
  for(let b=0xA1;b<=0xDF;b++){
    map.set(dec.decode(new Uint8Array([b])),[b]);
  }

  /* 2バイト文字 */
  const leads=[];
  for(let l=0x81;l<=0x9F;l++) leads.push(l);
  for(let l=0xE0;l<=0xFC;l++) leads.push(l);

  leads.forEach(l=>{
    for(let t=0x40;t<=0xFC;t++){
      if(t===0x7F) continue;
      const ch=dec.decode(new Uint8Array([l,t]));
      if(ch.length===1 && ch!=="\uFFFD" && !map.has(ch)){
        map.set(ch,[l,t]);
      }
    }
  });

  return map;

}

function encodeShiftJis(str){

  if(!SJIS_MAP) SJIS_MAP=buildSjisMap();

  let out="";

  for(const ch of str){

    if(/^[A-Za-z0-9\-_.~]$/.test(ch)){
      out+=ch;
    }else if(ch.charCodeAt(0)<0x80){
      out+=encodeURIComponent(ch).replace(/[!'()*]/g,
        c=>"%"+c.charCodeAt(0).toString(16).toUpperCase());
    }else if(SJIS_MAP.has(ch)){
      SJIS_MAP.get(ch).forEach(b=>{
        out+="%"+b.toString(16).toUpperCase().padStart(2,"0");
      });
    }

  }

  return out;

}

function zozoUrl(q){

  try{
    return ZOZO_SEARCH+encodeShiftJis(q);
  }catch(e){
    /* 非対応ブラウザ用の保険 */
    return ZOZO_SEARCH+encodeURIComponent(q);
  }

}

function rakutenUrl(q){
  return RAKUTEN_SEARCH+encodeURIComponent(q)+"/";

function esc(str){
  return String(str==null?"":str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function shrinkImage(dataUrl,max=1280){

  return new Promise((resolve,reject)=>{

    const img=new Image();

    img.onload=()=>{

      const ratio=
        Math.min(1,max/Math.max(img.width,img.height));

      const canvas=document.createElement("canvas");

      canvas.width=Math.round(img.width*ratio);
      canvas.height=Math.round(img.height*ratio);

      canvas
        .getContext("2d")
        .drawImage(img,0,0,canvas.width,canvas.height);

      resolve(
        canvas.toDataURL("image/jpeg",0.85).split(",")[1]
      );

    };

    img.onerror=()=>reject(
      new Error("画像を読み込めませんでした。別の写真でお試しください。")
    );

    img.src=dataUrl;

  });

}

function extractJson(text){

  const clean=text.replace(/```json|```/g,"").trim();

  const start=clean.indexOf("{");
  const end=clean.lastIndexOf("}");

  if(start<0 || end<0){
    throw new Error("AIの返答を読み取れませんでした。");
  }

  return JSON.parse(clean.slice(start,end+1));

}

    headers["anthropic-dangerous-direct-browser-access"]="true";
  }

  let response;

  try{

    response=await fetch(
      "https://api.anthropic.com/v1/messages",
      {
        method:"POST",
        headers,
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          messages:[{role:"user",content}]
        })
      }
    );

  }catch(e){

    throw new Error(
      "AIに接続できませんでした。claude.ai以外で開いている場合は、"
      +"写真の選択画面の「APIキーの設定」にキーを入力してください。"
    );

  }

  if(!response.ok){

    let detail="";

    try{
      const body=await response.json();
      detail=body.error && body.error.message
        ? body.error.message
        : "";
    }catch(e){}

    if(response.status===401){
      throw new Error("APIキーが正しくないか、設定されていません。");
    }

    throw new Error(
      `AIの解析でエラーが発生しました（${response.status}）${detail?"："+detail:""}`
    );

  }

  const data=await response.json();

  const text=
    (data.content||[])
      .map(i=>i.type==="text"?i.text:"")
      .join("\n");

  const result=extractJson(text);

  result.worn=Array.isArray(result.worn)?result.worn:[];
  result.similar=Array.isArray(result.similar)?result.similar:[];

  return result;

}

function renderQuestion(){

  const {section,q}=FLAT[current];

  let html=`

    <div class="quiz-nav">

      <button
        class="back-btn"
        id="back-btn"
      >
        ← 戻る
      </button>

    </div>

    ${renderProgress(section.label)}

    <div class="question">

      <h2>${q.q}</h2>
  `;


  /* AGE */

  if(q.type==="age"){

    html+=`

      <div class="input-box">

        <label for="age-input">
          年齢
        </label>

        <input
          id="age-input"
          type="number"
          min="10"
          max="100"
          placeholder="例：25"
        >

        <button
          class="primary-btn"
          id="age-next"
        >
          次へ
        </button>

      </div>
    `;

  }


  /* SWATCH */

  else if(q.type==="swatch"){

    html+=`<div class="swatch-grid">`;

    q.options.forEach((opt,idx)=>{

      html+=`

        <button
          class="swatch-option"
          data-idx="${idx}"
        >

          <span
            class="swatch-circle"
            style="background:${opt.bg||opt.color};"
          ></span>

          <span class="label">
            ${opt.t}
          </span>

        </button>
      `;

    });

    html+=`</div>`;

  }


  /* ACCESSORY */

  else if(q.type==="accessory"){

    const data=ACCESSORY_TYPES[q.key];

    html+=`

      <div class="options">

        ${data.options.map((opt,idx)=>`

          <button
            class="option accessory-option"
            data-idx="${idx}"
          >

            <span class="dot"></span>

            ${opt}

          </button>

        `).join("")}

      </div>
    `;

  }


  /* NORMAL */

  else{

    html+=`<div class="options">`;

    q.options.forEach((opt,idx)=>{

      html+=`

        <button
          class="option"
          data-idx="${idx}"
        >

          <span class="dot"></span>

          ${opt.t}

        </button>

      `;

    });

    html+=`</div>`;

  }


  html+=`
    </div>
  `;

  card.innerHTML=html;


  /* BACK */

  document
    .getElementById("back-btn")
    .addEventListener("click",()=>{

      if(current===0){

        renderGenderScreen();

        return;
      }

      current--;

      const last=history.pop();

      if(last && last.score){
        subtractScore(last.score);
      }

      if(last && last.accessoryKey){

        accessoryAnswers[
          last.accessoryKey
        ]=last.previousAccessory;

      }

      if(last && last.colorPref){

        preferredColor=last.previousColor;

      }

      if(last && last.ageValue!==undefined){

        age=last.previousAge;

      }

      renderQuestion();

    });


  /* AGE */

  if(q.type==="age"){

    document
      .getElementById("age-next")
      .addEventListener("click",()=>{

        const value=
          parseInt(
            document.getElementById("age-input").value
          );

        if(
          !value ||
          value<10 ||
          value>100
        ){

          alert("10〜100歳の範囲で入力してください。");

          return;
        }

        const previousAge=age;

        age=value;

        history.push({
          score:{},
          ageValue:value,
          previousAge:previousAge
        });

        current++;

        if(current<FLAT.length){
          renderQuestion();
        }else{
          renderResult();
        }

      });

    return;

  }


  /* ANSWERS */

  const selector=
    q.type==="swatch"
      ? ".swatch-option"
      : ".option";


  card
    .querySelectorAll(selector)
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        const idx=
          parseInt(btn.dataset.idx);

        if(q.type==="accessory"){

          const data=
            ACCESSORY_TYPES[q.key];

          const previous=
            accessoryAnswers[q.key];

          accessoryAnswers[q.key]=
            data.options[idx];

          history.push({

            score:{},

            accessoryKey:q.key,

            previousAccessory:previous

          });

        }else if(q.pref){

          const previousColor=
            preferredColor;

          preferredColor=
            q.options[idx].t;

          history.push({
            score:{},
            colorPref:true,
            previousColor:previousColor
          });

        }else{

          const opt=q.options[idx];

          addScore(opt.s);

          history.push({
            score:opt.s
          });

        }


        current++;


        if(current<FLAT.length){

          renderQuestion();

        }else{

          renderResult();

        }

      });

    });

}


/* =========================================================
   SCORE
========================================================= */

function addScore(map){

  Object.entries(map).forEach(([key,value])=>{

    scores[key]+=value;

  });

}


function subtractScore(map){

  Object.entries(map).forEach(([key,value])=>{

    scores[key]-=value;

  });

}


function topOf(keys){

  return keys
    .map(key=>[key,scores[key]])
    .sort((a,b)=>b[1]-a[1]);

}


function barGroup(sortedEntries,typesMap){

  const total=
    sortedEntries.reduce(
      (a,[,v])=>a+v,
      0
    ) || 1;

  let html=`
    <div class="bars">
  `;

  sortedEntries.forEach(([key,val])=>{

    const pct=
      Math.round(
        (val/total)*100
      );

    html+=`

      <div class="bar-row">

        <div class="bar-label">
          ${typesMap[key].name}
        </div>

        <div class="bar-track">

          <div
            class="bar-fill"
            style="
              width:${pct}%;
              background:${typesMap[key].barColor};
            "
          ></div>

        </div>

        <div class="bar-pct">
          ${pct}%
        </div>

      </div>

    `;

  });

  html+=`</div>`;

  return html;

}

  if(skeletonKey==="straight"){

    }


    <!-- PHOTOS -->

    ${photoHtml}


    <!-- SHOP -->

    <div class="shop-block">

      <h3>
        もっとアイテムを探す
      </h3>

      <p class="desc">
        ${colorSourceText}を加えて、
        テイストに合うアイテムをZOZOTOWN・楽天で探せます。
      </p>


      ${createShopRows(
        colorKey,
        taste
      )}

    </div>


    <button
      class="restart"
      id="restart"
    >
      もう一度診断する
    </button>

  `;


  document
    .getElementById("restart")
    .addEventListener(
      "click",
      resetAll
    );

}


/* =========================================================
   SHOP LINKS
========================================================= */

function createShopRows(
  colorKey,
  taste
){

  const colorKeyword=
    pickedColor() || COLOR_KEYWORD[colorKey];

  return taste.items
    .map(item=>{

      const keyword=
        [
          genderPrefix(),
          item.name,
          colorKeyword
        ]
        .filter(Boolean)
        .join(" ");

      return `

        <div class="shop-item">

          <div class="shop-item-name">
            ${item.name}
          </div>

          <div class="shop-links">

            <a
              class="shop-link zozo"
              href="${zozoUrl(keyword)}"
              target="_blank"
              rel="noopener"
            >
              ZOZOTOWNで探す
            </a>

            <a
              class="shop-link"
              href="${rakutenUrl(keyword)}"
              target="_blank"
              rel="noopener"
            >
              楽天で探す
            </a>

          </div>

        </div>

      `;

    })
    .join("");

}


/* =========================================================
   RESET
========================================================= */

function resetAll(){

  current=0;
  gender=null;
  age=null;
  diagnosisMode=null;
  preferredColor=null;
  photoAnalysis=null;
  photoGender="指定しない";

  history.length=0;

  Object.keys(scores)
    .forEach(key=>{
      scores[key]=0;
    });


  Object.keys(accessoryAnswers)
    .forEach(key=>{
      accessoryAnswers[key]=null;
    });


  photos.face=null;
  photos.full=null;


  renderHome();

}


/* =========================================================
   START
========================================================= */

renderHome();

</script>
